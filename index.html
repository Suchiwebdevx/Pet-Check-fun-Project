<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Check! 🐾</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 360px;
            width: 100%;
            position: relative;
            z-index: 10;
            box-sizing: border-box;
        }

        /* Strict sizing so the GIF never covers the screen */
        .gif-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: block;
        }

        h1 {
            color: #ff6b6b;
            font-size: 22px;
            margin-bottom: 8px;
        }

        #timer-text {
            color: #a4b0be;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            height: 50px;
        }

        .btn {
            padding: 10px 25px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            touch-action: manipulation;
        }

        .btn:disabled {
            background-color: #dfe4ea !important;
            color: #a4b0be !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        #yes-btn {
            background-color: #ff6b6b;
            color: white;
            position: relative;
        }

        #no-btn {
            background-color: #4ecdc4;
            color: white;
            position: relative;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="gif-container">
            <img src="https://c.tenor.com/S6DMP--rr3YAAAAd/kitten-cute-animal.gif" alt="Cute Kitten">
        </div>
        <h1>Your pet is lost? 🥺🐾</h1>
        <div id="timer-text">Wait <span id="countdown">5</span> seconds...</div>

        <div class="btn-container">
            <button id="yes-btn" class="btn" disabled>Yes</button>
            <button id="no-btn" class="btn" disabled>No</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const countdownEl = document.getElementById('countdown');
        const timerText = document.getElementById('timer-text');

        let timeLeft = 5;

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                yesBtn.disabled = false;
                noBtn.disabled = false;
                timerText.textContent = "Now catch me if you can! 😼";
                timerText.style.color = "#ff6b6b";
            }
        }, 1000);

        function moveButton(btn) {
            if (btn.disabled) return;

            const padding = 30;
            const maxX = window.innerWidth - btn.offsetWidth - padding;
            const maxY = window.innerHeight - btn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.random() * maxX);
            const randomY = Math.max(padding, Math.random() * maxY);

            btn.style.position = 'fixed';
            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;
        }

        yesBtn.addEventListener('mouseover', () => {
            if (!window.matchMedia("(pointer: coarse)").matches) {
                moveButton(yesBtn);
            }
        });
        noBtn.addEventListener('mouseover', () => {
            if (!window.matchMedia("(pointer: coarse)").matches) {
                moveButton(noBtn);
            }
        });

        let yesClicks = 0;
        yesBtn.addEventListener('click', (e) => {
            if (yesBtn.disabled) return;

            if (window.matchMedia("(pointer: coarse)").matches && yesClicks === 0) {
                e.preventDefault();
                moveButton(yesBtn);
                yesClicks++;
            } else {
                window.location.href = 'missing.html';
            }
        });

        let noClicks = 0;
        noBtn.addEventListener('click', (e) => {
            if (noBtn.disabled) return;

            if (window.matchMedia("(pointer: coarse)").matches && noClicks === 0) {
                e.preventDefault();
                moveButton(noBtn);
                noClicks++;
            } else {
                window.location.href = 'safe.html';
            }
        });
    </script>

</body>

</html>
