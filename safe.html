<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! 🍫</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #fbc531 0%, #e84118 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Strict sizing so the GIF never covers the screen */
        .gif-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: block;
        }

        h1 {
            color: #e84118;
            font-size: 22px;
            margin-bottom: 10px;
        }

        p {
            color: #2f3640;
            font-size: 15px;
            margin-bottom: 20px;
            font-weight: 500;
            line-height: 1.5;
        }

        .back-btn {
            background-color: #e84118;
            color: white;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: inline-block;
            transition: transform 0.2s ease, opacity 0.2s ease;
            touch-action: manipulation;
        }

        .back-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="gif-container">
            <img src="https://media1.tenor.com/images/e925ae1430bc72230747042137c5e057/tenor.gif?itemid=10222299"
                alt="Cute Funny Pet">
        </div>
        <h1>Hehe! 🤭</h1>
        <p>Hey now, buy me food or dark chocolate, cutie! 🍫🍕</p>
        <a href="index.html" class="back-btn">Go Back</a>
    </div>

</body>

</html>
